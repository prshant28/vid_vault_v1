kind = "mobile"
previewPath = "/mobile/"
title = "VidVault Mobile"
version = "1.0.0"
id = "artifacts/vidvault-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 8000

[services.development]
run = "PORT=8000 pnpm --filter @workspace/vidvault-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vidvault-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vidvault-mobile", "run", "serve" ]

[services.env]
PORT = "8000"
BASE_PATH = "/mobile/"
